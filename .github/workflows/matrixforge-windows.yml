name: MatrixForge Windows build

on:
  push:
    paths:
      - "MatrixForge/**"
      - ".github/workflows/matrixforge-windows.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the installer release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        working-directory: MatrixForge
        run: cmake -B build -A x64

      - name: Build (VST3, Standalone, tests)
        working-directory: MatrixForge
        run: cmake --build build --config Release --parallel

      - name: Render every factory preset
        working-directory: MatrixForge
        run: build\MatrixForgeTests_artefacts\Release\MatrixForgeTests.exe

      - name: Package
        shell: pwsh
        working-directory: MatrixForge
        run: |
          $out = "dist/MatrixForge-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "build/MatrixForge_artefacts/Release/VST3/MatrixForge.vst3" "$out/"
          Copy-Item "build/MatrixForge_artefacts/Release/Standalone/MatrixForge.exe" "$out/"
          Copy-Item "README.md" "$out/"

      - uses: actions/upload-artifact@v4
        with:
          name: MatrixForge-Windows-x64
          path: MatrixForge/dist/MatrixForge-Windows-x64

      - name: Build one-click installer
        shell: pwsh
        working-directory: MatrixForge
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(MatrixForge VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$version" installer\MatrixForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MF_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: MatrixForge-Setup
          path: MatrixForge/dist/MatrixForge-Setup.exe

      # Publish the installer under a fixed tag so it always has the same download link
      - name: Publish installer as a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete matrixforge-latest --yes --cleanup-tag 2>$null
          gh release create matrixforge-latest MatrixForge/dist/MatrixForge-Setup.exe `
            --target $env:GITHUB_SHA `
            --title "MatrixForge $env:MF_VERSION (latest build)" `
            --notes "One-click Windows installer. Run MatrixForge-Setup.exe: it installs the VST3 plug-in into C:\Program Files\Common Files\VST3 and the standalone app into Program Files, and adds an uninstaller. Built from $env:GITHUB_SHA."

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Build and test
        working-directory: MatrixForge
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target MatrixForgeTests --parallel 4
          ./build/MatrixForgeTests_artefacts/Release/MatrixForgeTests
